<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><meta name="description" content="Project Strike Asset Uploader V12 — organize FBX, GLB, glTF, Blender and texture packages and send them into the Project Strike FPS asset pipeline."><meta http-equiv="cache-control" content="no-store"><title>Project Strike Asset Uploader V12</title><style>html,body{margin:0;background:#08090b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui}#boot{padding:24px;max-width:760px;margin:auto}.bar{height:8px;background:#242a33;border-radius:99px;overflow:hidden}.bar i{display:block;width:35%;height:100%;background:#69adfa;animation:x 1.1s infinite alternate}@keyframes x{to{transform:translateX(185%)}}</style></head><body><div id="boot"><h2>Project Strike Asset Uploader V12</h2><p>Loading package organizer, 3D validation and Blender → GLB game pipeline…</p><div class="bar"><i></i></div></div><script>(async()=>{try{let h=await(await fetch('model-processor-v11.html?v12='+Date.now(),{cache:'no-store'})).text();h=h.replaceAll('Project Strike Asset Processor V11','Project Strike Asset Uploader V12');h=h.replaceAll('Project Strike Asset Processor','Project Strike Asset Uploader');h=h.replace('Smart package import → textures stay with their model → FBX/GLB browser processing → BLEND packages convert to GLB in the FPS repository.','Project Strike import → models, animations and textures stay organized → FBX/GLB browser validation → Blender packages convert to validated GLB in the FPS repository.');document.open();document.write(h);document.close();}catch(e){document.getElementById('boot').innerHTML='<h2>V12 failed to start</h2><pre style="white-space:pre-wrap;color:#ffaaaa">'+String(e)+'</pre>';}})();</script></body></html>
