<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><meta name="description" content="Project Strike Asset Uploader V11 — model, animation and texture package organizer with FBX/GLB validation and Blender-to-GLB FPS integration."><meta http-equiv="cache-control" content="no-store"><title>Project Strike Asset Uploader V11</title></head><body style="margin:0;background:#08090b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui;padding:24px">Loading Project Strike Asset Uploader V11…<script>(async()=>{try{let html=await fetch('model-processor-v11.html?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()});html=html.replace('CHUNK_SIZE=4*MiB','CHUNK_SIZE=2*MiB').replace("phase('Upload complete',100)","phase(fail?'Upload finished with errors':'Upload complete',100)");const oldChunks=`async function uploadChunks(repo,branch,root,file,token,onProgress){const count=Math.ceil(file.size/CHUNK_SIZE);for(let n=0;n<count;n++){onProgress?.(n+1,count);const content=await partB64(file,n*CHUNK_SIZE,Math.min(file.size,(n+1)*CHUNK_SIZE));await put(repo,branch,root+'/part-'+String(n).padStart(4,'0')+'.bin',content,token,'Project Strike chunk '+(n+1)+'/'+count+' for '+file.name);await sleep(25)}return count}`;const newChunks=`const PS_PENDING=new Map();async function gitBlob(repo,content,token){return gh('https://api.github.com/repos/'+repo+'/git/blobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content,encoding:'base64'})},token)}async function gitCommitEntries(repo,branch,entries,token,message){const ref=await gh('https://api.github.com/repos/'+repo+'/git/ref/heads/'+encodeURIComponent(branch),{method:'GET'},token),parent=ref.object.sha,commit=await gh('https://api.github.com/repos/'+repo+'/git/commits/'+parent,{method:'GET'},token),tree=await gh('https://api.github.com/repos/'+repo+'/git/trees',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({base_tree:commit.tree.sha,tree:entries})},token),next=await gh('https://api.github.com/repos/'+repo+'/git/commits',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,tree:tree.sha,parents:[parent]})},token);return gh('https://api.github.com/repos/'+repo+'/git/refs/heads/'+encodeURIComponent(branch),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({sha:next.sha,force:false})},token)}async function uploadChunks(repo,branch,root,file,token,onProgress){const count=Math.ceil(file.size/CHUNK_SIZE),entries=[];for(let n=0;n<count;n++){onProgress?.(n+1,count);const content=await partB64(file,n*CHUNK_SIZE,Math.min(file.size,(n+1)*CHUNK_SIZE)),blob=await gitBlob(repo,content,token);entries.push({path:safePath(root+'/part-'+String(n).padStart(4,'0')+'.bin'),mode:'100644',type:'blob',sha:blob.sha});await sleep(20)}PS_PENDING.set(root,entries);return count}`;html=html.replace(oldChunks,newChunks);const oldPut=`async function put(repo,branch,path,content,token,message){const api='https://api.github.com/repos/'+repo+'/contents/'+safePath(path).split('/').map(encodeURIComponent).join('/');let sha=null;try{const old=await gh(api+'?ref='+encodeURIComponent(branch),{method:'GET'},token);sha=old.sha||null}catch(e){if(!String(e.message).includes('404'))throw e}const body={message,content,branch};if(sha)body.sha=sha;return gh(api,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)},token)}`;const newPut=`async function put(repo,branch,path,content,token,message){if(path.endsWith('/package.json')){const root=path.slice(0,-'/package.json'.length),entries=[];for(const[k,v]of PS_PENDING)if(k.startsWith(root+'/'))entries.push(...v);const blob=await gitBlob(repo,content,token);entries.push({path:safePath(path),mode:'100644',type:'blob',sha:blob.sha});if(entries.length){await gitCommitEntries(repo,branch,entries,token,message);for(const k of[...PS_PENDING.keys()])if(k.startsWith(root+'/'))PS_PENDING.delete(k);return{batched:true}}}const api='https://api.github.com/repos/'+repo+'/contents/'+safePath(path).split('/').map(encodeURIComponent).join('/');let sha=null;try{const old=await gh(api+'?ref='+encodeURIComponent(branch),{method:'GET'},token);sha=old.sha||null}catch(e){if(!String(e.message).includes('404'))throw e}const body={message,content,branch};if(sha)body.sha=sha;return gh(api,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)},token)}`;html=html.replace(oldPut,newPut);html=html.replace('<script type="module">','<script src="network-patch.js?ts='+Date.now()+'"><\/script><script type="module">');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<main style="padding:24px"><h1>V11 failed to start</h1><pre style="white-space:pre-wrap;color:#ffaaaa">'+String(e)+'</pre></main>'}})();<\/script></body></html>
