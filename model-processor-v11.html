<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#08090b"><meta http-equiv="cache-control" content="no-store"><meta http-equiv="pragma" content="no-cache"><meta http-equiv="expires" content="0"><title>Project Strike Asset Processor V11</title><style>html,body{margin:0;background:#08090b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui}#boot{padding:24px;max-width:760px;margin:auto}.bar{height:8px;background:#242a33;border-radius:999px;overflow:hidden}.bar i{display:block;width:35%;height:100%;background:#69adfa;animation:x 1s infinite alternate}@keyframes x{to{transform:translateX(185%)}}pre{white-space:pre-wrap;color:#ffaaaa}</style></head><body><div id="boot"><h2>Project Strike Asset Processor V11</h2><p>Loading stable asset processor…</p><div class="bar"><i></i></div></div><script>(async()=>{try{const source='https://raw.githubusercontent.com/matthewcodergamer/RAGE-Weapon-Audio-Web/8eefe9d21afb88e09b7e3315e2f4c5b190571d19/model-processor-v9.html?ts='+Date.now();const res=await fetch(source,{cache:'no-store'});if(!res.ok)throw new Error('Could not load stable processor: HTTP '+res.status);let h=await res.text();h=h.replaceAll('Project Strike Asset Processor V9','Project Strike Asset Processor V11');h=h.replaceAll('<title>Project Strike Asset Processor V9</title>','<title>Project Strike Asset Processor V11</title>');h=h.replaceAll('Math.min(devicePixelRatio,2)','Math.min(devicePixelRatio,1)');h=h.replaceAll('Math.min(window.devicePixelRatio,2)','Math.min(window.devicePixelRatio,1)');h=h.replaceAll('antialias:true','antialias:false');h=h.replaceAll('antialias: true','antialias: false');const patch=`<script>(function(){
const MB_LIMIT=32;
let autoUploading=false;
function n(sel){return document.querySelector(sel)}
function numText(el){if(!el)return 0;const m=String(el.textContent||'').match(/[\\d,.]+/);return m?Number(m[0].replaceAll(',','')):0}
function queueHasItems(){return !!document.querySelector('.asset')}
function syncUploadButton(){const b=n('#uploadBtn');if(!b)return;if(queueHasItems()){b.disabled=false;b.textContent='Upload + Convert Organized Assets';b.style.opacity='1'}else{b.disabled=true}}
function installUploadBridge(){const b=n('#uploadBtn');if(!b||b.dataset.v11Bridge)return;b.dataset.v11Bridge='1';b.addEventListener('click',async function(e){if(autoUploading)return;const ready=numText(n('#readyN'));const prep=n('#prepareBtn');if(ready===0&&prep&&!prep.disabled&&queueHasItems()){e.preventDefault();e.stopImmediatePropagation();autoUploading=true;b.disabled=true;b.textContent='Preparing assets…';prep.click();const start=Date.now();while(Date.now()-start<120000){await new Promise(r=>setTimeout(r,500));const r=numText(n('#readyN'));const phase=String(n('#phaseText')?.textContent||'').toLowerCase();if(r>0||phase.includes('complete')||phase.includes('ready')||phase.includes('failed'))break}autoUploading=false;syncUploadButton();if(numText(n('#readyN'))>0){setTimeout(()=>b.click(),60)}else{const st=n('#status');if(st){st.className='status bad';st.textContent='No runtime assets became ready. Check Live activity for the exact conversion error.'}}}},true)}
function assetSizeMB(card){const t=card?.textContent||'';const m=t.match(/([\\d.]+)\\s*MB/i);return m?Number(m[1]):0}
function installPreviewGuard(){document.addEventListener('click',function(e){const btn=e.target.closest('button');if(!btn||btn.textContent.trim()!=='Preview')return;const card=btn.closest('.asset');const size=assetSizeMB(card);if(size>MB_LIMIT){e.preventDefault();e.stopImmediatePropagation();const report=n('#report');if(report)report.textContent='iPhone safe-preview blocked this '+size.toFixed(1)+' MB source model. Loading its full textures can exceed Safari memory and reload the page. The asset is still available for preparation/upload; use a smaller runtime GLB or desktop preview for this heavy source.';const viewer=n('#viewer');if(viewer)viewer.classList.remove('busy');return}setTimeout(()=>{const canvases=document.querySelectorAll('#viewer canvas');if(canvases.length>1){for(let i=0;i<canvases.length-1;i++)canvases[i].remove()}},250)},true)}
function boot(){installUploadBridge();syncUploadButton();installPreviewGuard();const obs=new MutationObserver(()=>{installUploadBridge();syncUploadButton()});obs.observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled','class']});setInterval(syncUploadButton,1000)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();<\/script>`;h=h.replace('</body>',patch+'</body>');if(!h.includes('Project Strike Asset Processor V11'))throw new Error('Stable processor source did not load correctly');document.open();document.write(h);document.close();}catch(e){document.getElementById('boot').innerHTML='<h2>V11 failed to start</h2><pre>'+String(e)+'</pre>';}})();</script></body></html>
