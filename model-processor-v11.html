<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><meta http-equiv="cache-control" content="no-store"><title>Project Strike Asset Processor V11</title><style>html,body{margin:0;background:#08090b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui}#boot{padding:24px;max-width:760px;margin:auto}.bar{height:8px;background:#242a33;border-radius:999px;overflow:hidden}.bar i{display:block;width:35%;height:100%;background:#69adfa;animation:x 1s infinite alternate}@keyframes x{to{transform:translateX(185%)}}pre{white-space:pre-wrap;color:#ffaaaa}</style></head><body><div id="boot"><h2>Project Strike Asset Processor V11</h2><p>Loading stable asset processor…</p><div class="bar"><i></i></div></div><script>
(async()=>{try{
const source='https://raw.githubusercontent.com/matthewcodergamer/RAGE-Weapon-Audio-Web/main/model-processor-v11.html?ts='+Date.now();
const res=await fetch(source,{cache:'no-store'});if(!res.ok)throw new Error('Could not load V11 source: HTTP '+res.status);
let h=await res.text();
const old="fetch('model-processor-v9.html?v11src='+Date.now(),{cache:'no-store'})";
const abs="fetch('https://raw.githubusercontent.com/matthewcodergamer/RAGE-Weapon-Audio-Web/main/model-processor-v9.html?v11src='+Date.now(),{cache:'no-store'})";

document.open();document.write(h);document.close();
}catch(e){document.getElementById('boot').innerHTML='<h2>V11 failed to start</h2><pre>'+String(e)+'</pre>';}})();
</script></body></html>
