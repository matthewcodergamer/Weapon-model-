<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><title>Project Strike Asset Processor V11</title><style>html,body{margin:0;background:#08090b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui}#boot{padding:24px;max-width:760px;margin:auto}.bar{height:8px;background:#242a33;border-radius:99px;overflow:hidden}.bar i{display:block;width:35%;height:100%;background:#69adfa;animation:x 1.1s infinite alternate}@keyframes x{to{transform:translateX(185%)}}</style></head><body><div id="boot"><h2>Project Strike Asset Processor V11</h2><p>Loading Blender-package conversion + smart texture organizer…</p><div class="bar"><i></i></div></div><script>
(async()=>{try{let h=await(await fetch('https://cdn.jsdelivr.net/gh/matthewcodergamer/RAGE-Weapon-Audio-Web@8eefe9d21afb88e09b7e3315e2f4c5b190571d19/model-processor-v9.html?v11src='+Date.now(),{cache:'no-store'})).text();

h=h.replace("const MODEL=new Set(['fbx','glb','gltf','blend']),IMG=new Set(['png','jpg','jpeg','webp','tga','bmp','ktx2','avif']),DEP=new Set([...IMG,'bin','mtl','obj']);","const MODEL=new Set(['fbx','glb','gltf','blend']),IMG=new Set(['png','jpg','jpeg','webp','tga','bmp','ktx2','avif','gif','tif','tiff','exr','hdr']),DEP=new Set([...IMG,'bin','mtl','obj']);");
h=h.replace("if(/crate|barrier|sandbag|cover|container|barrel|pallet/.test(x))return'models/environment/cover';","if(/crate|ammo.?box|ammunition.?box|barrier|sandbag|cover|container|barrel|pallet/.test(x))return'models/environment/cover';");
h=h.replace('<div class="stat"><b id="depsN">0</b><span>dependencies</span></div><div class="stat"><b id="readyN">0</b><span>ready runtime assets</span></div>','<div class="stat"><b id="depsN">0</b><span>textures / dependencies</span></div><div class="stat"><b id="blendN">0</b><span>Blender sources</span></div><div class="stat"><b id="readyN">0</b><span>ready runtime assets</span></div><div class="stat"><b id="queuedN">0</b><span>queued / converting</span></div>');
h=h.replace('<button id="uploadBtn" class="btn green" style="margin-top:12px" disabled>Upload Ready Assets</button>','<div class="actions" style="margin-top:12px"><button id="uploadBtn" class="btn green" disabled>Upload + Convert Organized Assets</button><button id="checkBtn" class="btn" disabled>Check Conversion Status</button></div>');
const start=h.indexOf('function buildItems(){');const end=h.indexOf('function summary()',start);if(start<0||end<0)throw Error('Could not patch discovery');
const replacement=`function textureRole(n){const x=n.toLowerCase();if(/base.?color|basecolor|albedo|diffuse|_diff\\b|_d\\b/.test(x))return'Base Color';if(/normal|_nor\\b|_nrm\\b/.test(x))return'Normal';if(/rough|roughness/.test(x))return'Roughness';if(/metal|metallic/.test(x))return'Metallic';if(/ambient.?occlusion|occlusion|_ao\\b/.test(x))return'AO';if(/(^|[_\\-.])(orm|arm)([_\\-.]|$)/.test(x))return'ORM / ARM';if(/height|displace|displacement/.test(x))return'Height / Displacement';if(/emissive|emission|glow/.test(x))return'Emissive';if(/opacity|alpha|transparen/.test(x))return'Opacity / Alpha';if(/specular|spec\\b/.test(x))return'Specular';if(/thumbnail|preview|render|reference|ref\\b|cover/.test(x))return'Reference Image';return'Image / Texture'}function packageRoot(p){const a=p.replaceAll('\\\\','/').split('/').filter(Boolean);if(a.length<=1)return clean(stem(a[0]||'asset'));const tex=a.findIndex(x=>/^textures?$/i.test(x));if(tex>0)return clean(a[tex-1]);return clean(a[0])}function ownerFor(path,owners){const d=dirname(path).toLowerCase(),root=packageRoot(path);let best=null,score=-1;for(const o of owners){const od=dirname(o.path).toLowerCase();let s=packageRoot(o.path)===root?100:0;if(od&&d.startsWith(od))s+=od.length;if(s>score){score=s;best=o}}return score>0?best:null}function buildItems(){S.items=[];const owners=[];for(const[path,file]of S.files){if(junk(path,file.size))continue;const e=ext(path);if(e==='blend'){const x={type:'blend',kind:e,path,name:base(path),sourceName:base(path),file,status:'source',category:classify(path),runtime:null,error:'Source package ready. Upload it to queue real Blender → GLB conversion.',packageId:packageRoot(path)};S.items.push(x);owners.push(x)}else if(['fbx','glb','gltf'].includes(e)){const a=isAnim(path),x={type:a?'animation':'model',kind:e,path,name:base(path),sourceName:base(path),file,status:'pending',category:classify(path,a),runtime:null,error:'',packageId:packageRoot(path)};S.items.push(x);if(!a)owners.push(x)}}for(const[path,file]of S.files){if(junk(path,file.size))continue;const e=ext(path);if(!DEP.has(e)||['fbx','glb','gltf','blend'].includes(e))continue;const owner=ownerFor(path,owners),role=IMG.has(e)?textureRole(path):e.toUpperCase(),pkg=owner?.packageId||packageRoot(path);S.items.push({type:'dependency',kind:e,path,name:base(path)+' · '+role,sourceName:base(path),file,status:owner?'matched':'dependency',category:owner?.category||'',runtime:null,error:'',ownerPath:owner?.path||'',packageId:pkg,role});log(\`Matched \${base(path)} → \${owner?owner.name:pkg} · \${role}\`,'good')}render();summary();log(\`Discovery: \${S.items.filter(i=>i.type==='model').length} models, \${S.items.filter(i=>i.type==='animation').length} animations, \${S.items.filter(i=>i.type==='dependency').length} textures/dependencies, \${S.items.filter(i=>i.type==='blend').length} Blender source(s)\`,'good')}`;
h=h.slice(0,start)+replacement+h.slice(end);
const ss=h.indexOf('function summary(){'),se=h.indexOf('function render(){',ss);if(ss<0||se<0)throw Error('Could not patch summary');
const summary=`function summary(){$('#modelsN').textContent=S.items.filter(i=>i.type==='model').length;$('#animN').textContent=S.items.filter(i=>i.type==='animation').length;$('#depsN').textContent=S.items.filter(i=>i.type==='dependency').length;$('#blendN').textContent=S.items.filter(i=>i.type==='blend').length;$('#readyN').textContent=S.items.filter(i=>i.status==='ready'||i.status==='runtime-ready').length;$('#queuedN').textContent=S.items.filter(i=>['uploaded','queued','converting'].includes(i.status)).length;$('#sizeN').textContent=bytes([...S.files.values()].reduce((a,f)=>a+f.size,0));const any=S.items.some(i=>i.type!=='dependency'),ready=S.items.some(i=>i.status==='ready'||i.type==='blend');$('#prepareBtn').disabled=S.busy||!any;$('#clearBtn').disabled=S.busy||(!S.items.length&&!S.failedPackages.length);$('#uploadBtn').disabled=S.busy||!ready;const cb=$('#checkBtn');if(cb)cb.disabled=S.busy||!S.items.some(i=>i.type==='blend'&&['uploaded','queued','converting','runtime-ready'].includes(i.status))}`;
h=h.slice(0,ss)+summary+h.slice(se);
h=h.replace("const pill=i.status==='ready'?'<span class=\"pill ok\">ready</span>':i.status==='failed'?'<span class=\"pill err\">failed</span>':i.type==='blend'?'<span class=\"pill warn\">Blender source</span>':'<span class=\"pill\">pending</span>';","const pill=(i.status==='ready'||i.status==='runtime-ready')?'<span class=\"pill ok\">'+(i.status==='runtime-ready'?'runtime ready':'ready')+'</span>':i.status==='failed'?'<span class=\"pill err\">failed</span>':i.status==='matched'?'<span class=\"pill ok\">matched to package</span>':i.status==='uploaded'?'<span class=\"pill warn\">uploaded · queued</span>':i.status==='converting'?'<span class=\"pill warn\">converting</span>':i.type==='blend'?'<span class=\"pill warn\">Blender source</span>':'<span class=\"pill\">pending</span>'; ");
h=h.replace("<div class=\"meta\">${i.type.toUpperCase()} · ${i.kind.toUpperCase()} · ${bytes(i.file.size)}${i.rep?` · ${i.rep.meshes} meshes · ${i.rep.triangles.toLocaleString()} tris · ${i.rep.animations} anim`:''}</div>","<div class=\"meta\">${i.type.toUpperCase()} · ${i.kind.toUpperCase()} · ${bytes(i.file.size)}${i.rep?` · ${i.rep.meshes} meshes · ${i.rep.triangles.toLocaleString()} tris · ${i.rep.animations} anim`:''}${i.packageId?` · package: ${i.packageId}`:''}${i.role?` · ${i.role}`:''}</div>");
h=h.replace("<button class=\"btn small preview\" ${i.type==='blend'?'disabled':''}>Preview</button>","<button class=\"btn small preview\" ${i.type==='blend'?'disabled':''}>${i.type==='blend'?'GLB after upload':'Preview'}</button>");
const us=h.indexOf('async function uploadAll(){');const ue=h.indexOf('function clearAll()',us);if(us<0||ue<0)throw Error('Could not patch uploader');
const uploader=`async function uploadAll(){const t=$('#token').value.trim(),repo=$('#repo').value.trim(),branch=$('#branch').value.trim();if(!t)return setStatus('Enter your GitHub token.','bad');const runtime=S.items.filter(i=>i.status==='ready'&&i.runtime),blends=S.items.filter(i=>i.type==='blend'),jobs=[];for(const i of runtime)jobs.push({item:i,path:\`public/game-assets/\${i.category}/\${clean(stem(i.sourceName||i.name))}.glb\`,blob:i.runtime,kind:'runtime'});const handled=new Set();for(const b of blends){const pkg=clean(b.packageId||stem(b.sourceName||b.name));for(const[p,f]of S.files){if(junk(p,f.size)||packageRoot(p)!==b.packageId)continue;const parts=p.replaceAll('\\\\','/').split('/').filter(Boolean);let rel=parts.length>1?parts.slice(1).join('/'):parts[0];rel=rel||base(p);const out=\`assets-source/imports/\${pkg}/raw/\${rel.split('/').map(clean).join('/')}\`;if(handled.has(out))continue;handled.add(out);jobs.push({item:b,path:out,blob:f,kind:'source'})}const runtimeName=clean(stem(b.sourceName||b.name));const manifest={version:2,name:runtimeName,runtimeName,category:b.category||'models/props',source:b.path,packageId:pkg,conversion:'blender-headless-glb',textureCount:S.items.filter(i=>i.type==='dependency'&&i.packageId===b.packageId).length,uploadedAt:new Date().toISOString()};jobs.push({item:b,path:\`assets-source/imports/\${pkg}/asset.json\`,blob:new Blob([JSON.stringify(manifest,null,2)],{type:'application/json'}),kind:'manifest'})}S.busy=true;let done=0,failed=0;for(let n=0;n<jobs.length;n++){const j=jobs[n];phase(\`Uploading \${n+1}/\${jobs.length}: \${j.path}\`,true);progress(n/jobs.length*100,j.path);try{await put(repo,branch,j.path,j.blob,t);done++;if(j.kind==='manifest'){j.item.status='uploaded';j.item.error='Package uploaded completely. Blender conversion is queued in the FPS repository.'}log(\`Uploaded \${j.path}\`,'good')}catch(e){failed++;j.item.status='failed';j.item.error=e.message||String(e);log(\`UPLOAD FAILED \${j.path}: \${e.message||e}\`,'error')}render();await sleep(120)}S.busy=false;progress(100,\`Upload complete · \${done} files · \${failed} failed\`);setStatus(failed?\`Upload finished with \${failed} failure(s). Successful files were kept.\`:\`Upload complete. Blender manifests were sent last, so conversion only starts after every source/texture is present.\`,failed?'bad':'good');phase('Upload pass finished',false);summary()}async function checkConversions(){const t=$('#token').value.trim(),repo=$('#repo').value.trim(),branch=$('#branch').value.trim();if(!t)return setStatus('Enter your GitHub token.','bad');const blends=S.items.filter(i=>i.type==='blend'&&['uploaded','queued','converting','runtime-ready'].includes(i.status));if(!blends.length)return setStatus('No uploaded Blender packages to check.');S.busy=true;for(let n=0;n<blends.length;n++){const i=blends[n],name=clean(stem(i.sourceName||i.name)),reportPath=\`public/game-assets/manifests/conversion-reports/\${name}.json\`,runtimePath=\`public/game-assets/\${i.category}/\${name}.glb\`;phase(\`Checking conversion \${n+1}/\${blends.length}: \${name}\`,true);try{const reportApi=\`https://api.github.com/repos/\${repo}/contents/\${reportPath.split('/').map(encodeURIComponent).join('/')}?ref=\${encodeURIComponent(branch)}\`;const runtimeApi=\`https://api.github.com/repos/\${repo}/contents/\${runtimePath.split('/').map(encodeURIComponent).join('/')}?ref=\${encodeURIComponent(branch)}\`;const r=await gh('GET',reportApi,t);await gh('GET',runtimeApi,t);i.status='runtime-ready';i.error='Validated GLB is ready in the FPS runtime asset tree.';log(\`Runtime ready: \${runtimePath}\`,'good')}catch(e){i.status='converting';i.error='Uploaded successfully. Conversion is queued/running; check again shortly.';log(\`Still converting: \${name}\`,'warn')}render();await sleep(100)}S.busy=false;phase('Conversion status check complete',false);summary()}`;
h=h.slice(0,us)+uploader+h.slice(ue);
h=h.replace("$('#uploadBtn').onclick=uploadAll;","$('#uploadBtn').onclick=uploadAll;$('#checkBtn').onclick=checkConversions;");
document.open();document.write(h);document.close();}catch(e){document.getElementById('boot').innerHTML='<h2>V11 failed to start</h2><pre style="white-space:pre-wrap;color:#ffaaaa">'+String(e)+'</pre>';}})();
</script></body></html>
