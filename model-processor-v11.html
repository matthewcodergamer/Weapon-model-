<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#08090b"><meta http-equiv="cache-control" content="no-store"><meta http-equiv="pragma" content="no-cache"><meta http-equiv="expires" content="0"><title>Project Strike Asset Processor V11</title><style>html,body{margin:0;background:#08090b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui}#boot{padding:24px;max-width:760px;margin:auto}.bar{height:8px;background:#242a33;border-radius:999px;overflow:hidden}.bar i{display:block;width:35%;height:100%;background:#69adfa;animation:x 1s infinite alternate}@keyframes x{to{transform:translateX(185%)}}pre{white-space:pre-wrap;color:#ffaaaa}</style></head><body><div id="boot"><h2>Project Strike Asset Processor V11</h2><p>Loading stable asset processor…</p><div class="bar"><i></i></div></div><script>(async()=>{try{const source='https://raw.githubusercontent.com/matthewcodergamer/RAGE-Weapon-Audio-Web/8eefe9d21afb88e09b7e3315e2f4c5b190571d19/model-processor-v9.html?ts='+Date.now();const res=await fetch(source,{cache:'no-store'});if(!res.ok)throw new Error('Could not load stable processor: HTTP '+res.status);let h=await res.text();h=h.replaceAll('Project Strike Asset Processor V9','Project Strike Asset Processor V11');h=h.replaceAll('<title>Project Strike Asset Processor V9</title>','<title>Project Strike Asset Processor V11</title>');h=h.replaceAll('Math.min(devicePixelRatio,2)','Math.min(devicePixelRatio,1.15)');h=h.replaceAll('Math.min(window.devicePixelRatio,2)','Math.min(window.devicePixelRatio,1.15)');h=h.replaceAll('antialias:true','antialias:false');h=h.replaceAll('antialias: true','antialias: false');h=h.replace('<button id="uploadBtn" class="btn green" style="margin-top:12px" disabled>Upload Ready Assets</button>','<button id="uploadBtn" class="btn green" style="margin-top:12px">Upload + Convert Organized Assets</button><p class="muted" style="margin-top:8px">FBX files are prepared as GLB before upload. GLB files upload directly. The button remains available whenever files are loaded.</p>');const classic=`<script>(function(){
let bridging=false;
const q=s=>document.querySelector(s);
function num(el){const m=String(el?.textContent||'').match(/[\\d,.]+/);return m?Number(m[0].replaceAll(',','')):0}
function cards(){return [...document.querySelectorAll('.asset')]}
function filename(card){const b=card?.querySelector('b');return (b?.textContent||'').trim()}
function suggested(name){const x=name.toLowerCase();if(/mixamo|mocap|animation/.test(x)){if(/pistol/.test(x))return'animations/pistol';if(/rifle|carbine|m4|ak/.test(x))return'animations/rifle';if(/shotgun/.test(x))return'animations/shotgun';if(/death|killed|execution/.test(x))return'animations/deaths';if(/walk|run|sprint|jump|slide|crouch|strafe|idle|land/.test(x))return'animations/locomotion';return'animations/combat'}if(/mp7|mp5|ump|vector|p90|smg/.test(x))return'models/weapons/smgs';if(/pistol|handgun|glock|1911|service.?pistol|revolver/.test(x))return'models/weapons/pistols';if(/shotgun|remington|mossberg|spas/.test(x))return'models/weapons/shotguns';if(/sniper|awp|barrett|marksman/.test(x))return'models/weapons/snipers';if(/m249|lmg|machine.?gun/.test(x))return'models/weapons/lmgs';if(/scope|optic|sight|red.?dot|holo|suppressor|silencer|foregrip|peq/.test(x))return'models/weapons/attachments';if(/m4|m4a1|rifle|carbine|ak47|aks|assault/.test(x))return'models/weapons/rifles';if(/grenade|frag|flashbang/.test(x))return'models/grenades';if(/fps.?arm|first.?person|hands|gloves/.test(x))return'models/characters/first_person_arms';if(/soldier|operator|marine|fighter|swat|character/.test(x))return'models/characters/operators';if(/helmet|vest|backpack|pouch|equipment/.test(x))return'models/characters/equipment';if(/warehouse|building|house|downtown|factory|tower/.test(x))return'models/environment/buildings';if(/wall|door|window|stairs|catwalk|modular/.test(x))return'models/environment/modular';if(/container|crate|barrier|sandbag|cover|barrel|pallet|ammo.?box/.test(x))return'models/environment/cover';if(/pipe|industrial|generator|machine/.test(x))return'models/environment/industrial';if(/tree|grass|plant|bush|foliage/.test(x))return'models/environment/foliage';if(/boulder|rock|terrain|ground|road|asphalt|sand|mud|dirt/.test(x))return'models/environment/terrain';return null}
function improveCards(){for(const card of cards()){const sel=card.querySelector('select');if(!sel)continue;let lab=card.querySelector('.v11dest');if(!lab){lab=document.createElement('div');lab.className='meta v11dest';lab.textContent='Destination category';sel.before(lab)}const s=suggested(filename(card));if(s&&[...sel.options].some(o=>o.value===s)&&sel.value!==s){sel.value=s;sel.dispatchEvent(new Event('change',{bubbles:true}))}}}
function syncUpload(){const b=q('#uploadBtn');if(!b)return;const has=cards().length>0;b.disabled=!has;b.textContent=has?'Upload + Convert Organized Assets':'Upload + Convert Organized Assets';b.style.opacity=has?'1':'.42'}
async function bridgeUpload(e){const b=e.target.closest?.('#uploadBtn');if(!b||bridging)return;if(!cards().length)return;const ready=num(q('#readyN'));if(ready>0)return;const prep=q('#prepareBtn');if(!prep||prep.disabled){e.preventDefault();e.stopImmediatePropagation();const st=q('#status');if(st){st.className='status bad';st.textContent='Assets are loaded but preparation is not available yet. Re-select the files and tap Prepare Everything once.'}return}e.preventDefault();e.stopImmediatePropagation();bridging=true;b.disabled=true;b.textContent='Preparing + converting…';prep.click();const start=Date.now();while(Date.now()-start<180000){await new Promise(r=>setTimeout(r,400));const r=num(q('#readyN'));const phase=String(q('#phaseText')?.textContent||'').toLowerCase();if(r>0||phase.includes('complete')||phase.includes('finished')||phase.includes('failed'))break}bridging=false;syncUpload();if(num(q('#readyN'))>0){setTimeout(()=>b.click(),80)}else{const st=q('#status');if(st){st.className='status bad';st.textContent='Preparation finished but no runtime assets are ready. Check Live activity for the conversion error.'}}}
function boot(){document.addEventListener('click',bridgeUpload,true);const ob=new MutationObserver(()=>{improveCards();syncUpload()});ob.observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled','class']});improveCards();syncUpload();setInterval(()=>{improveCards();syncUpload()},800)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();<\/script>`;
const modulePatch=`<script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{FBXLoader}from'three/addons/loaders/FBXLoader.js';
let R=null,S=null,C=null,O=null,OBJ=null,MIX=null,raf=0;
const q=s=>document.querySelector(s);
function directFiles(){return [...(q('#filesInput')?.files||[]),...(q('#folderInput')?.files||[])]}
function fileFor(name){const clean=String(name).trim();return directFiles().find(f=>f.name===clean||f.webkitRelativePath?.endsWith('/'+clean))}
function dispose(){if(MIX){MIX.stopAllAction();MIX=null}if(OBJ&&S){S.remove(OBJ);OBJ.traverse(o=>{o.geometry?.dispose?.();const ms=Array.isArray(o.material)?o.material:[o.material];ms.filter(Boolean).forEach(m=>{for(const v of Object.values(m))if(v?.isTexture)v.dispose?.();m.dispose?.()})});OBJ=null}}
function setup(){if(R)return;const v=q('#viewer');if(!v)return;[...v.querySelectorAll('canvas')].forEach(c=>c.remove());S=new THREE.Scene();C=new THREE.PerspectiveCamera(45,1,.01,10000);C.position.set(2,1.2,3);R=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'});R.setPixelRatio(Math.min(devicePixelRatio,1.15));v.appendChild(R.domElement);O=new OrbitControls(C,R.domElement);O.enableDamping=true;S.add(new THREE.HemisphereLight(0xffffff,0x3b3b3b,2.4));const d=new THREE.DirectionalLight(0xffffff,2.2);d.position.set(3,5,4);S.add(d);const resize=()=>{const w=v.clientWidth,h=v.clientHeight;R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix()};resize();addEventListener('resize',resize);let last=performance.now();const loop=t=>{raf=requestAnimationFrame(loop);const dt=Math.min((t-last)/1000,.05);last=t;if(MIX)MIX.update(dt);O.update();R.render(S,C)};raf=requestAnimationFrame(loop)}
function fit(o){const b=new THREE.Box3().setFromObject(o),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),r=Math.max(s.x,s.y,s.z)||1;O.target.copy(c);C.position.copy(c).add(new THREE.Vector3(r*1.6,r*.8,r*1.8));C.near=Math.max(.001,r/1000);C.far=Math.max(100,r*100);C.updateProjectionMatrix();O.update()}
function metrics(root,anims){let meshes=0,tris=0,bones=0,mats=new Set(),tex=new Set();root.traverse(o=>{if(o.isMesh){meshes++;const g=o.geometry;tris+=g.index?g.index.count/3:(g.attributes.position?.count||0)/3;const ms=Array.isArray(o.material)?o.material:[o.material];ms.filter(Boolean).forEach(m=>{mats.add(m.uuid);for(const v of Object.values(m))if(v?.isTexture)tex.add(v.uuid)})}if(o.isBone)bones++});return{meshes,tris:Math.round(tris),bones,materials:mats.size,textures:tex.size,animations:anims.length}}
async function previewFBX(btn){const card=btn.closest('.asset');const name=card?.querySelector('b')?.textContent?.trim();if(!name||!name.toLowerCase().endsWith('.fbx'))return false;const f=fileFor(name);if(!f)return false;setup();dispose();const report=q('#report');if(report)report.textContent='Loading FBX '+name+'…';try{const ab=await f.arrayBuffer();if(ab.byteLength<1024)throw new Error('file is incomplete ('+ab.byteLength+' bytes)');const obj=new FBXLoader().parse(ab,'');OBJ=obj;S.add(obj);fit(obj);const anims=obj.animations||[];if(anims.length){MIX=new THREE.AnimationMixer(obj);MIX.clipAction(anims[0]).play()}const m=metrics(obj,anims);if(report)report.textContent=name+'\n'+m.meshes+' meshes · '+m.tris.toLocaleString()+' triangles · '+m.materials+' materials · '+m.textures+' textures · '+m.bones+' bones · '+m.animations+' animations';return true}catch(err){if(report)report.textContent='FBX preview failed: '+err.message+'\n\nIf this says unexpected EOF, the selected FBX itself is truncated or uses data Safari/Three.js cannot parse. The uploader will still attempt conversion during Prepare Everything.';return true}}
document.addEventListener('click',async e=>{const b=e.target.closest?.('button');if(!b||b.textContent.trim()!=='Preview')return;const card=b.closest('.asset');const name=card?.querySelector('b')?.textContent?.trim()||'';if(!name.toLowerCase().endsWith('.fbx'))return;const f=fileFor(name);if(!f)return;e.preventDefault();e.stopImmediatePropagation();await previewFBX(b)},true);
<\/script>`;
h=h.replace('</body>',classic+modulePatch+'</body>');if(!h.includes('Project Strike Asset Processor V11'))throw new Error('Stable processor source did not load correctly');document.open();document.write(h);document.close();}catch(e){document.getElementById('boot').innerHTML='<h2>V11 failed to start</h2><pre>'+String(e)+'</pre>';}})();</script></body></html>
