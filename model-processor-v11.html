const replacement=`function textureRole(n){const x=n.toLowerCase();if(/base.?color|basecolor|albedo|diffuse|_diff\\b|_d\\b/.test(x))return'Base Color';if(/normal|_nor\\b|_nrm\\b/.test(x))return'Normal';if(/rough|roughness/.test(x))return'Roughness';if(/metal|metallic/.test(x))return'Metallic';if(/ambient.?occlusion|occlusion|_ao\\b/.test(x))return'AO';if(/(^|[_\\-.])(orm|arm)([_\\-.]|$)/.test(x))return'ORM / ARM';if(/height|displace|displacement/.test(x))return'Height / Displacement';if(/emissive|emission|glow/.test(x))return'Emissive';if(/opacity|alpha|transparen/.test(x))return'Opacity / Alpha';if(/specular|spec\\b/.test(x))return'Specular';if(/thumbnail|preview|render|reference|ref\\b|cover/.test(x))return'Reference Image';return'Image / Texture'}function packageRoot(p){const a=p.replaceAll('\\\\','/').split('/').filter(Boolean);if(a.length<=1)return clean(stem(a[0]||'asset'));const tex=a.findIndex(x=>/^textures?$/i.test(x));if(tex>0)return clean(a[tex-1]);return clean(a[0])}function ownerFor(path,owners){const d=dirname(path).toLowerCase(),root=packageRoot(path);let best=null,score=-1;for(const o of owners){const od=dirname(o.path).toLowerCase();let s=packageRoot(o.path)===root?100:0;if(od&&d.startsWith(od))s+=od.length;if(s>score){score=s;best=o}}return score>0?best:null}function buildItems(){S.items=[];const owners=[];for(const[path,file]of S.files){if(junk(path,file.size))continue;const e=ext(path);if(e==='blend'){const x={type:'blend',kind:e,path,name:base(path),sourceName:base(path),file,status:'source',category:classify(path),runtime:null,error:'Ready for server conversion to GLB.',packageId:clean(stem(base(path)))};S.items.push(x);owners.push(x)}else if(['fbx','glb','gltf'].includes(e)){const a=isAnim(path),x={type:a?'animation':'model',kind:e,path,name:base(path),sourceName:base(path),file,status:'pending',category:classify(path,a),runtime:null,error:'',packageId:clean(stem(base(path)))};S.items.push(x);owners.push(x)}}for(const[path,file]of S.files){if(junk(path,file.size))continue;const e=ext(path);if(!DEP.has(e)||['fbx','glb','gltf','blend'].includes(e))continue;const owner=ownerFor(path,owners),role=IMG.has(e)?textureRole(path):e.toUpperCase(),pkg=owner?.packageId||packageRoot(path);S.items.push({type:'dependency',kind:e,path,name:base(path)+' · '+role,sourceName:base(path),file,status:owner?'matched':'dependency',category:owner?.category||'',runtime:null,error:'',ownerPath:owner?.path||'',packageId:pkg,role});log(\`Matched \${base(path)} → \${owner?owner.name:pkg} · \${role}\`,'good')}render();summary();log(\`Discovery: \${S.items.filter(i=>i.type==='model').length} models, \${S.items.filter(i=>i.type==='animation').length} animations, \${S.items.filter(i=>i.type==='dependency').length} textures/dependencies, \${S.items.filter(i=>i.type==='blend').length} Blender source(s)\`,'good')}`;

const us=h.indexOf('async function uploadAll(){'),ue=h.indexOf('function clearAll()',us);if(us<0||ue<0)throw Error('Could not patch uploader');
const uploader=`function safeBranch(){let b=$('#branch').value.trim();if(!b||/^public\\//i.test(b)){b='main';$('#branch').value='main';log('Invalid branch/path value replaced with main.','warn')}return b}function ownedDeps(i){return S.items.filter(d=>d.type==='dependency'&&(d.ownerPath===i.path||(!d.ownerPath&&d.packageId===i.packageId)))}function pushChunkJobs(jobs,manifests,i,pkg,blob){const CHUNK=12*1024*1024,count=Math.ceil(blob.size/CHUNK);for(let n=0;n<count;n++)jobs.push({item:i,path:\`assets-source/imports/\${pkg}/chunks/part-\${String(n).padStart(4,'0')}.bin\`,blob:blob.slice(n*CHUNK,Math.min(blob.size,(n+1)*CHUNK)),kind:'chunk'});return count}async function uploadAll(){const t=$('#token').value.trim(),repo=$('#repo').value.trim(),branch=safeBranch();if(!t)return setStatus('Enter your GitHub token first.','bad');const uploadables=S.items.filter(i=>['model','animation','blend'].includes(i.type)&&i.status!=='failed'),jobs=[],manifests=[],claimed=new Set();if(!uploadables.length)return setStatus('No uploadable assets were found.','bad');for(const i of uploadables){const runtimeName=clean(stem(i.sourceName||i.name)),pkg=clean(runtimeName),isDirectGLB=i.kind==='glb'&&i.file.size<90*1024*1024;if(isDirectGLB){jobs.push({item:i,path:\`public/game-assets/\${i.category}/\${runtimeName}.glb\`,blob:i.file,kind:'runtime'});continue}const deps=ownedDeps(i),sourceRel=\`source.\${i.kind}\`;let chunked=false,chunkCount=0;if(i.file.size>18*1024*1024){chunked=true;chunkCount=pushChunkJobs(jobs,manifests,i,pkg,i.file)}else jobs.push({item:i,path:\`assets-source/imports/\${pkg}/raw/\${sourceRel}\`,blob:i.file,kind:'source'});for(const d of deps){const key=d.path;if(claimed.has(key))continue;claimed.add(key);jobs.push({item:i,path:\`assets-source/imports/\${pkg}/raw/textures/\${clean(d.sourceName||base(d.path))}\`,blob:d.file,kind:'dependency'})}const manifest={version:3,name:runtimeName,runtimeName,category:i.category||'models/props',sourceName:sourceRel,sourceKind:i.kind,packageId:pkg,chunked,chunkCount,conversion:'blender-headless-glb',textureCount:deps.length,uploadedAt:new Date().toISOString()};manifests.push({item:i,path:\`assets-source/imports/\${pkg}/asset.json\`,blob:new Blob([JSON.stringify(manifest,null,2)],{type:'application/json'}),kind:'manifest'})}jobs.push(...manifests);S.busy=true;summary();let done=0,failed=0;for(let n=0;n<jobs.length;n++){const j=jobs[n];phase(\`Uploading \${n+1}/\${jobs.length}: \${j.item.name}\`,true);progress(n/jobs.length*100,\`${n+1}/\${jobs.length} · \${j.path}\`);try{await put(repo,branch,j.path,j.blob,t);done++;if(j.kind==='runtime'){j.item.status='runtime-ready';j.item.error='GLB uploaded directly to the FPS runtime tree.'}else if(j.kind==='manifest'){j.item.status='uploaded';j.item.error='Source package uploaded completely. Server GLB conversion is queued.'}log(\`Uploaded \${j.path}\`,'good')}catch(e){failed++;j.item.status='failed';j.item.error=e.message||String(e);log(\`UPLOAD FAILED \${j.path}: \${e.message||e}\`,'error')}render();await sleep(80)}S.busy=false;progress(100,\`Upload complete · \${done}/\${jobs.length} · \${failed} failed\`);setStatus(failed?\`Upload completed with \${failed} failed file(s). Successful files were kept; see Live activity.\`:'Upload complete. Direct GLBs are in runtime; FBX/glTF/BLEND and oversized GLBs are queued for validated server conversion.',failed?'bad':'good');phase('Upload pass finished',false);summary()}async function checkConversions(){const t=$('#token').value.trim(),repo=$('#repo').value.trim(),branch=safeBranch();if(!t)return setStatus('Enter your GitHub token first.','bad');const queued=S.items.filter(i=>['model','animation','blend'].includes(i.type)&&['uploaded','queued','converting','runtime-ready'].includes(i.status));if(!queued.length)return setStatus('Nothing queued to check yet.');S.busy=true;summary();for(let n=0;n<queued.length;n++){const i=queued[n],name=clean(stem(i.sourceName||i.name)),reportPath=\`public/game-assets/manifests/conversion-reports/\${name}.json\`,runtimePath=\`public/game-assets/\${i.category}/\${name}.glb\`;if(i.kind==='glb'&&i.file.size<90*1024*1024&&i.status==='runtime-ready')continue;phase(\`Checking \${n+1}/\${queued.length}: \${name}\`,true);try{await gh('GET',\`https://api.github.com/repos/\${repo}/contents/\${reportPath.split('/').map(encodeURIComponent).join('/')}?ref=\${encodeURIComponent(branch)}\`,t);await gh('GET',\`https://api.github.com/repos/\${repo}/contents/\${runtimePath.split('/').map(encodeURIComponent).join('/')}?ref=\${encodeURIComponent(branch)}\`,t);i.status='runtime-ready';i.error='Validated GLB is ready in the FPS runtime tree.';log(\`Runtime ready: \${runtimePath}\`,'good')}catch(e){i.status='converting';i.error='Uploaded. GitHub conversion is queued or running.';log(\`Still converting: \${name}\`,'warn')}render();await sleep(80)}S.busy=false;phase('Conversion status check complete',false);summary()}`;
